<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi página de prueba</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
      color: #333;
    }
    h1 {
      color: #2c3e50;
    }
    form {
      margin-top: 20px;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      max-width: 400px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 15px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #34495e;
    }
    .counter {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Hola, esta es mi página de prueba</h1>

  <!-- FORMULARIO DE CONTACTO -->
  <form action="https://formspree.io/f/xyzlrldb" method="POST">
    <h2>Contáctanos</h2>
    <input type="text" name="name" placeholder="Pablo Castro" required>
    <input type="email" name="email" placeholder="salcaro72@hotmail.com" required>
    <textarea name="message" placeholder="Hola a todos aqui en este contacto se enviara información del metodo de bates"4" required></textarea>
    <button type="submit">Enviar</button>
  </form>

  <!-- CONTADOR DE VISITAS -->
  <div class="counter">
    Visitas: <span id="visits">0</span>
  </div>

  <script>
    // Contador simple usando localStorage
    let visits = localStorage.getItem('visits');
    if (!visits) visits = 0;
    visits++;
    localStorage.setItem('visits', visits);
    document.getElementById('visits').innerText = visits;
  </script>
</body>
</html>
